runtime:
  cache_dir: ./.cache/antora

site:
  title: OpenShift application basics
  url: https://jwimsingues.github.io/openshift-app-basics
  start_page: openshift-app-basics::index.adoc

content:
  sources:
    - url: ./
      branches: HEAD
      start_path: documentation

asciidoc:
  attributes:
    release-version: master
    page-pagination: true
  extensions:
    - ./lib/tab-block.js
    - ./lib/remote-include-processor.js

ui:
  bundle:
    url: https://github.com/redhat-developer-demos/rhd-tutorial-ui/releases/download/v0.1.10/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui

output:
  dir: ./gh-pages
