# secret.yaml
# Purpose: Store a lab token that the page must not show. GitOps syncs this file.
# This value is a sample for the lab. Do not put a real password here.
apiVersion: v1
kind: Secret
metadata:
  name: workshop-web-token
  labels:
    app: workshop-web
    app.kubernetes.io/part-of: openshift-app-basics
type: Opaque
stringData:
  token: lab-sample-token
